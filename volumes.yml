services:
  langgraph-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Use environment variable for dynamic project name
      - ./agents/sql_search_agent/csv:/deps/outer-${PROJECT_DIR:-langgraph_data_swarm}/${PROJECT_DIR:-langgraph_data_swarm}/agents/sql_search_agent/csv
      - ./agents/plot_agent/plots:/deps/outer-${PROJECT_DIR:-langgraph_data_swarm}/${PROJECT_DIR:-langgraph_data_swarm}/agents/plot_agent/plots