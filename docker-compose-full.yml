version: '3.8'

services:
  # Airport AI Agent API (Containerized)
  app:
    build: .
    image: khh_airport_ai_agent_web
    container_name: khh_airport_ai_agent_web
    ports:
      - "8001:8001"  # API endpoint
    depends_on:
      redis-chat:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-chat:6379/0  # This overwrites the .env file REDIS_URL
    restart: always
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2.5G
        reservations:
          memory: 1G
    volumes:
      # Development mounts (remove for production)
      - ./api:/app/api:rw           # API code (for hot reload)
      - ./agents:/app/agents:rw     # Agent code
      # Note: Use :ro (read-only) for database to prevent accidental modifications
    networks:
      - aiot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Chat Redis with RedisInsight
  redis-chat:
    image: "redis/redis-stack:latest"
    container_name: redis_chat_server_web
    ports:
      - "6379:6379"  # Redis port
      - "8004:8001"  # RedisInsight UI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - aiot_network

  # Open WebUI - Web-based Chat Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Use service name since everything is in Docker
      - OPENAI_API_BASE_URLS=http://app:8001/v1
      - OPENAI_API_KEYS=sk-dummy-key
      - WEBUI_AUTH=True  # Disable authentication
      - DEFAULT_USER_ROLE=admin  # Make default user admin
      - ENABLE_SIGNUP=True  # Allow signup
      - ENABLE_LOGIN_FORM=True  # Show login form
      - ENABLE_OPENAI_API=true
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    depends_on:
      app:
        condition: service_healthy
    restart: always
    volumes:
      - open-webui:/app/backend/data
    networks:
      - aiot_network

volumes:
  open-webui:
  redis-data:

networks:
  aiot_network:
    driver: bridge

